<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 170 1200" width="170" height="1200">
  <!-- กอบัวประดับขอบจอด้านขวา — ภาพกลับด้านของ lotus-left.svg -->
  <defs>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff0f5"/>
      <stop offset="1" stop-color="#ec7aac"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dbb7a"/>
      <stop offset="1" stop-color="#3f8a4b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe2ef" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe2ef" stop-opacity="0"/>
    </radialGradient>
    <path id="p" d="M0 0 C-12 -17 -10 -44 0 -55 C10 -44 12 -17 0 0 Z" fill="url(#petal)" stroke="#e4a2c0" stroke-width="0.6"/>
    <g id="lotus">
      <use href="#p" transform="rotate(-64) scale(0.88)"/>
      <use href="#p" transform="rotate(64) scale(0.88)"/>
      <use href="#p" transform="rotate(-40)"/>
      <use href="#p" transform="rotate(40)"/>
      <use href="#p" transform="rotate(-17) scale(1.05)"/>
      <use href="#p" transform="rotate(17) scale(1.05)"/>
      <use href="#p" transform="scale(1.12)"/>
      <ellipse cx="0" cy="-7" rx="8" ry="4.5" fill="#f3c64d"/>
    </g>
  </defs>
  <g opacity="0.9" transform="translate(170 0) scale(-1 1)">
    <circle cx="70" cy="200" r="90" fill="url(#glow)"/>
    <ellipse cx="62" cy="300" rx="72" ry="20" fill="url(#leaf)"/>
    <path d="M62 300 L104 296 L62 286 Z" fill="#2f6d3a"/>
    <ellipse cx="128" cy="316" rx="40" ry="11" fill="url(#leaf)" opacity="0.85"/>
    <path d="M70 296 Q74 250 68 214" stroke="#4d8f52" stroke-width="5" fill="none" stroke-linecap="round"/>
    <use href="#lotus" transform="translate(68 214) scale(1.15)"/>
    <path d="M30 292 Q24 252 34 226" stroke="#4d8f52" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M34 226 C22 212 26 186 34 176 C42 186 46 212 34 226 Z" fill="url(#petal)" stroke="#e4a2c0" stroke-width="0.6"/>
  </g>
</svg>
